<html data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <title>barkeeper</title>
  <meta name="description" content="barkeeper is a simple tool to manage bar programs. Proudly coded by hand without LLMs - I have no idea what I'm doing and am well capable of generating my own tech debt!">
  <meta name="author" content="couchsofa">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 16 16'><text x='0' y='14'>🥃</text></svg>" />

  <script type="module" src="/src/main.js"></script>

  <style>
    /* Chrome, Safari, Edge, Opera */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* Firefox */
    input[type=number] {
      -moz-appearance: textfield;
    }
    svg .axis{
      font-size: 0.8rem;
    }

    svg .chart-tooltip {
      font-weight: bold;
      font-size: 1.2rem;
    }

    body {
      background: #CCE7ED;
      background-image: linear-gradient(135deg, hsla(191, 48%, 86%, 1) 36%, hsla(288, 85%, 84%, 1) 96%);
      min-width: 64rem;
    }

    [data-bs-theme=dark] body {
      background: #081417;
      background-image: linear-gradient(135deg, hsla(191, 48%, 6%, 1) 36%, hsla(288, 85%, 4%, 1) 96%);
    }

    canvas {
      width: 100%;
      height: auto;
    }

    h5 {
      margin-top: 0.3em;
      margin-bottom: 0.3em;
    }

    section {
      /* TODO: find a way to count siblings of template tag to limit number of columns to number of cards
               section:has(template:nth-child(1 of div)) does seem to brake with alpinejs :c */
      --column_min_width: min(30rem, 100%);  
      --column_max_width: 35rem;  
      --gap: 1rem;
      --column_count: max(1, round(down, 100cqw / (var(--gap) + var(--column_min_width))));
        
      position: relative;
      display: grid;
      container-name: grid_container;
      container-type: inline-size;
      

      gap: var(--gap); 
      grid-template-columns: repeat(auto-fill, minmax(var(--column_min_width), 1fr));

      max-width: calc(var(--column_max_width) * var(--column_count));
      margin-inline: auto;
    }

    section.double-width {
      --column_min_width: min(2 * 30rem, 100%);  
      --column_max_width: 2 * 35rem;  
      --gap: 1rem; 
      --column_count: max(1, round(down, 100cqw / (var(--gap) + var(--column_min_width))));
        
      position: relative;
      display: grid;
      container-name: grid_container;
      container-type: inline-size;
      

      gap: var(--gap); 
      grid-template-columns: repeat(auto-fill, minmax(var(--column_min_width), 1fr));

      max-width: calc(var(--column_max_width) * var(--column_count));
      margin-inline: auto;
    }

    section:has(template.cards-1), section.cards-1 {
      --column_count: 1;
    }

    section:has(template.cards-2), section.cards-2 {
      --column_count: min(2, max(1, round(down, 100cqw / (var(--gap) + var(--column_min_width)))));
    }

    section:has(template.cards-3), section.cards-3 {
      --column_count: min(3, max(1, round(down, 100cqw / (var(--gap) + var(--column_min_width)))));
    }

    section:has(template.cards-4), section.cards-4 {
      --column_count: min(4, max(1, round(down, 100cqw / (var(--gap) + var(--column_min_width)))));
    }

    section:has(template.cards-5), section.cards-5 {
      --column_count: min(5, max(1, round(down, 100cqw / (var(--gap) + var(--column_min_width)))));
    }

    section:has(template.cards-6), section.cards-6 {
      --column_count: min(6, max(1, round(down, 100cqw / (var(--gap) + var(--column_min_width)))));
    }

    section:has(template.cards-7), section.cards-7 {
      --column_count: min(7, max(1, round(down, 100cqw / (var(--gap) + var(--column_min_width)))));
    }

    section:has(template.cards-8), section.cards-8 {
      --column_count: min(8, max(1, round(down, 100cqw / (var(--gap) + var(--column_min_width)))));
    }

    #header {
      background-color: white;
    }

    [data-bs-theme=dark] #header {
      background-color: black;
    }

    .container {
      max-width: 100%;
    }

    .card-title {
      font-size: 2em;
      font-weight: bold;
    }

    .nav-tabs .nav-item.show .nav-link, .nav-tabs .nav-link.active {
      background-color: #CCE7ED;
      border-bottom-color: #CCE7ED;
    }

    [data-bs-theme=dark] .nav-tabs .nav-item.show .nav-link {
      background-color: #081417;
      border-bottom-color: #081417;
    }

    [data-bs-theme=dark] .nav-tabs .nav-link.active {
      background-color: #081417;
      border-bottom-color: #081417;
    }

    .form-control, .form-select {
      border-width: 0px 0px 1px 0px;
    }

    .form-select:focus, .form-control:focus {
      box-shadow: none;
    } 

    .input-group-text {
      border-width: 0px 0px 1px 0px;
      /* background: transparent;
      font-weight: bold; */
    }

    .form-control.is-invalid {
      padding-right: 0.75rem;
      background-image: none;
    }

    .grid-table .row {
      border-bottom: 1px solid #ced4da;
      line-height: 1.5;
      padding: .375rem .75rem;
    }

    .grid-table-striped .row:nth-child(even of :not(.grid-table-block, .grid-table-heading)) {
      background-color: #f8f9fa;
    }

    [data-bs-theme=dark] .grid-table-striped .row:nth-child(even of :not(.grid-table-block, .grid-table-heading)) {
      background-color: #232424;
    }

    .grid-table-heading {
      font-weight: 500;
      font-size: 1.25rem;
      background-color: #e9ecef;
      border-bottom-width: 4px !important;
    }

    [data-bs-theme=dark] .grid-table-heading {
      background-color: #3c3d3d;
    }

    .grid-table-heading > div:first-child {
      padding-left: 0 !important;
    }

    .grid-table-block {
      background-color: #fff !important;
      white-space: pre;
    }

    [data-bs-theme=dark] .grid-table-block {
      background-color: #000 !important;
    }

    .grid-table-block > div:first-child{
      padding: 0 !important;
    }

    .grid-table-highlight .pill {
      border-color: black;      
    }

    .grid-table .row:not(.grid-table-block, .grid-table-heading):hover {
      background-color: #fff3cd !important;
    }

    [data-bs-theme=dark] .grid-table .row:not(.grid-table-block, .grid-table-heading):hover {
      background-color: #373838 !important;
    }

    .grid-table-muted {
      color: #a4a7ab;
    }

    [data-bs-theme=dark] .grid-table-muted {
      color: #3b3c3d;
    }

    .grid-table-muted:before {
      content: "(";
    }

    .grid-table-muted:after {
      content: ")";
    }

    .table-scroll {
      overflow-x: auto;
    }

    .table-scroll-heading {
      font-weight: 500;
      font-size: 1.25rem;
      background-color: #e9ecef;
      border-bottom-width: 4px !important;
    }

    [data-bs-theme=dark] .table-scroll-heading {
      background-color: #3c3d3d;
    }

    .table-scroll tr:not(.table-scroll-heading):hover {
      background-color: #fff3cd !important;
    }

    [data-bs-theme=dark] .table-scroll tr:not(.table-scroll-heading):hover {
      background-color: #373838 !important;
    }

    .table-scroll tr {
      border-bottom: 1px solid #ced4da;
      line-height: 1.5;
      padding: .375rem .75rem !important;
    }

    .table-scroll-striped tr:nth-child(even) {
      background-color: #f8f9fa;
    }

    [data-bs-theme=dark] .table-scroll-striped tr:nth-child(even) {
      background-color: #232424;
    }

    .table-scroll td {
      padding: .35rem;
    }

    .table-scroll th {
      padding: .5rem;
    }

    .table-scroll table {
      border-collapse: collapse;
      width: 100%;
      margin-inline: auto;
      overflow-x: scroll;
    }

    .no-wrap {
      text-wrap: nowrap;
    }

    .pill {
      display: inline-block;
      border: 3px solid rgba(0, 0, 0, .1);
      border-radius: .5rem;
      padding: .1rem .35rem .1rem .35rem;
      height: 1rem;
      width: 1.6rem;
      margin-right: 1rem;
    }

    /* tag input */
    .tags-input {
      display: flex;
      flex-wrap: wrap;
      background-color: #fff;
      border-width: 1px;
      border-radius: .25rem;
      padding-left: .5rem;
      padding-right: 1rem;
      padding-top: .5rem;
      padding-bottom: .25rem;
      min-height: 3.25rem;
    }

    [data-bs-theme=dark] .tags-input {
      background-color: #212529;
    }

    .tags-input-tag {
      display: inline-flex;
      line-height: 1.5;
      align-items: center;
      font-size: .875rem;
      background-color: #e2e3e5;
      border-radius: .25rem;
      border: 1px solid transparent;
      border-color: #cfcfcf;
      user-select: none;
      padding-inline: .5rem;
      margin-right: .5rem;
      margin-bottom: .25rem;
    }

    [data-bs-theme=dark] .tags-input-tag {
      background-color: #2b3035;
      border-color: #404040;
    }

    .tags-input-tag:last-of-type {
      margin-right: 0;
    }

    .tags-input-tag:has(.tags-input-remove:hover) {
      border-color: #dc3545;
    }

    .tags-input-remove:hover {
      color: #dc3545;
    }

    .tags-input-remove {
      color: #842029;
      font-size: 1.125rem;
      line-height: 1.5;
      border: 0;
      background-color: transparent;
      padding: 0;
      margin-bottom: .25rem;
    }

    .tags-input-remove:first-child {
      margin-right: .25rem;
    }

    .tags-input-remove:last-child {
      margin-left: .25rem;
    }

    .tags-input-text {
      flex: 1;
      padding-top: .25rem;
      padding-bottom: .25rem;
      margin-left: .5rem;
      margin-bottom: .25rem;
      min-width: 10rem;
    }

    /* menu */
    .menu-minimal {
      font-family: "Arial", sans-serif;
      font-size: 1.85rem;
      line-height: 1.2;
      margin-left: 1rem;
    }

    .menu-minimal .price {
      text-align: right;
      vertical-align: top;
      padding-top: 1rem;
      padding-right: 1.5rem;
      width: 5ch;
    }

    .menu-minimal .name {
      padding-top: 1rem;
      font-weight: bold;
    }

    .menu-minimal .ingredients {
      padding-top: .25rem;
      font-size: 1rem;
    }

    .menu-minimal .flavorCues {
      padding-top: .25rem;
      font-size: 1rem;
    }

    .menu-minimal .info {
      padding-top: .25rem;
      font-size: .8rem;
    }

    /* bar sheet  */
    .bar-sheet-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .bar-sheet {
      font-family: "Arial", sans-serif;
      font-size: 1rem;
      line-height: 1;
      padding-bottom: 1rem;
      padding-inline: 1rem;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
    }

    .bar-sheet .name {
      font-family: "Arial", sans-serif;
      font-size: 1.85rem;
      padding: .5rem 0;
      font-weight: bold;
      flex: 0 0 100%;
    }

    .bar-sheet .prep {
      margin-inline: .5rem;
    }

    .bar-sheet .prep div {
      margin-top: .5rem;
      margin-bottom: .5rem;
    }

    .bar-sheet .recipe .ingredients {
      display: flex;
      flex-wrap: wrap;
    }

    .bar-sheet .recipe .garnishes {
      display: flex;
      flex-wrap: wrap;
    }

    .bar-sheet .recipe .recipe-col {
      display: flex;
      flex-direction: column;
      margin-inline: .5rem;
    }

    .bar-sheet .recipe .recipe-col div {
      margin-top: .5rem;
      margin-bottom: .5rem;
    }

    .bar-sheet .recipe .garnishes {
      border-top: 2px solid black;
    }

    [data-bs-theme=dark] .bar-sheet .recipe .garnishes {
      border-top: 2px solid #fff;
    }

    @media print {
      .btn, .shopping-list-source-select {
        display: none !important;
      }
    }

    #boot-status {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bs-body-bg);
      font-size: 1.25rem;
    }

    #boot-status[hidden] {
      display: none;
    }

    #boot-status.boot-error {
      color: var(--bs-danger);
    }

    #header h1 .space-switcher {
      font-size: 1.25rem;
      vertical-align: middle;
    }
  </style>

</head>
<body>
  <div id="boot-status" class="d-print-none"><span class="boot-message">Starting…</span></div>
  <div id="printarea"></div>
  <div
    x-data="{
      tabs: ['Ingredients',],
      ideaTabStub: [{id: 'null', name: 'Ideas'}],
    }">

<!-- Navigation -->
    <div id="header" class="d-print-none">
      <h1>
        🥃 barkeeper
        <span class="dropdown space-switcher">
          <button
            type="button"
            class="btn btn-outline-secondary dropdown-toggle"
            data-bs-toggle="dropdown"
            x-text="$store.barkeeper.space.name || 'Space'"></button>
          <ul class="dropdown-menu">
            <template x-for="space in $store.barkeeper.space.list" :key="space.url">
              <li>
                <a
                  class="dropdown-item"
                  :class="{ 'active': space.url === $store.barkeeper.space.url }"
                  href="#"
                  x-text="space.name"
                  @click.prevent="space.url !== $store.barkeeper.space.url && $store.barkeeper.switchSpace(space.url)"></a>
              </li>
            </template>
            <li><hr class="dropdown-divider"></li>
            <li>
              <a class="dropdown-item" href="#" @click.prevent="$store.barkeeper.activeTab = '⚙'">Manage spaces…</a>
            </li>
          </ul>
        </span>
      </h1>
      <ul class="nav nav-tabs">
        <template x-for="event in $store.barkeeper.data.events.concat(ideaTabStub)" :key="event.id">
          <li
            @click="$store.barkeeper.activeTab = event.id"
            class="nav-item">
            <a
              class="nav-link"
              :class="{ 'active': $store.barkeeper.activeTab === event.id }"
              href="#"
              x-text="event.name"></a>
          </li>
        </template>
        <template x-for="tab in tabs">
          <li
            @click="$store.barkeeper.activeTab = tab"
            class="nav-item">
            <a
              class="nav-link"
              :class="{ 'active': $store.barkeeper.activeTab === tab }"
              href="#"
              x-text="tab"></a>
          </li>
        </template>
        <li
            @click="$store.barkeeper.activeTab = '⚙'"
            class="nav-item">
            <a
              class="nav-link"
              :class="{ 'active': $store.barkeeper.activeTab === '⚙' }"
              href="#">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-gear-fill" viewBox="0 0 16 16">
                  <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/>
                </svg>
                ​
              </a>
          </li>
      </ul>
    </div>

<!-- Space errors and notices -->
    <div class="container mt-3 d-print-none space-messages" x-show="$store.barkeeper.space.error || $store.barkeeper.space.notice">
      <div class="alert alert-danger" role="alert" x-show="$store.barkeeper.space.error">
        <span x-text="$store.barkeeper.space.error"></span>
        <button type="button" class="btn-close float-end" @click="$store.barkeeper.space.error = null"></button>
      </div>
      <div class="alert alert-success" role="status" x-show="$store.barkeeper.space.notice">
        <span class="space-notice" x-text="$store.barkeeper.space.notice"></span>
        <button type="button" class="btn-close float-end" @click="$store.barkeeper.space.notice = null"></button>
      </div>
    </div>

<!-- Settings -->
  <template x-if="$store.barkeeper.activeTab === '⚙'">
    <div class="container p-3">

      <section class="mb-3">
        <div class="card">
          <div class="card-header card-title">Space</div>
          <div class="card-body">
            <p class="text-body-secondary">
              A space is one bar crew's data: recipes, ingredients and events. It is end-to-end encrypted and
              synced through <code x-text="$store.barkeeper.space.server"></code>, which relays it without being able to read it.
            </p>

            <label class="form-label" for="space-name">Name</label>
            <input
              id="space-name"
              type="text"
              class="form-control mb-3"
              :value="$store.barkeeper.space.name"
              @change="$store.barkeeper.renameSpace($event.target.value)">

            <h6>Members</h6>
            <ul class="list-group mb-3">
              <template x-for="member in $store.barkeeper.space.members" :key="member.id">
                <li class="list-group-item d-flex align-items-center gap-2">
                  <span class="flex-grow-1" x-text="$store.barkeeper.memberName(member)"></span>
                  <span class="badge text-bg-secondary" x-text="member.access"></span>
                  <button
                    type="button"
                    class="btn btn-outline-danger btn-sm"
                    x-show="$store.barkeeper.space.canAdmin && !member.isSelf && !member.isSyncServer"
                    @click="$store.barkeeper.revokeMember(member)">✗</button>
                </li>
              </template>
            </ul>

            <div x-data="{ level: 'edit' }" x-show="$store.barkeeper.space.canAdmin">
              <h6>Invite</h6>
              <div class="input-group mb-2">
                <select class="form-select" x-model="level" style="max-width: 10rem;">
                  <option value="read">can view</option>
                  <option value="edit">can edit</option>
                  <option value="admin">admin</option>
                </select>
                <button
                  type="button"
                  class="btn btn-primary"
                  :disabled="$store.barkeeper.space.busy"
                  @click="$store.barkeeper.createInvite(level)">Create invite link</button>
              </div>
              <template x-if="$store.barkeeper.space.invite">
                <div class="input-group mb-2">
                  <input type="text" class="form-control invite-link" readonly :value="$store.barkeeper.space.invite" @focus="$event.target.select()">
                  <button type="button" class="btn btn-outline-secondary" @click="navigator.clipboard.writeText($store.barkeeper.space.invite)">Copy</button>
                </div>
              </template>
              <p class="text-body-secondary small">
                Anyone with the link can join, as often as they like, until you remove the invite link from the members above.
              </p>
            </div>
          </div>
        </div>
      </section>

      <section class="mb-3">
        <div class="card">
          <div class="card-header card-title">All spaces on this device</div>
          <ul class="list-group list-group-flush">
            <template x-for="space in $store.barkeeper.space.list" :key="space.url">
              <li class="list-group-item d-flex align-items-center gap-2">
                <span class="flex-grow-1" x-text="space.name"></span>
                <span class="badge text-bg-primary" x-show="space.url === $store.barkeeper.space.url">open</span>
                <button
                  type="button"
                  class="btn btn-outline-secondary btn-sm"
                  x-show="space.url !== $store.barkeeper.space.url"
                  @click="$store.barkeeper.switchSpace(space.url)">Open</button>
                <button
                  type="button"
                  class="btn btn-outline-danger btn-sm"
                  @click="$store.barkeeper.leaveSpace(space.url)">Forget</button>
              </li>
            </template>
            <li class="list-group-item" x-data="{ newSpace: '' }">
              <div class="input-group">
                <input
                  type="text"
                  class="form-control new-space-name"
                  placeholder="New space, e.g. GPN"
                  x-model="newSpace"
                  @keyup.enter="$store.barkeeper.newSpace(newSpace)">
                <button
                  type="button"
                  class="btn btn-outline-success"
                  :disabled="$store.barkeeper.space.busy"
                  @click="$store.barkeeper.newSpace(newSpace)">✚</button>
              </div>
            </li>
          </ul>
        </div>
      </section>

      <section class="mb-3">
        <div class="card">
          <div class="card-header card-title">This device</div>
          <div class="card-body">
            <label class="form-label" for="device-name">Your name, as other members see it</label>
            <input
              id="device-name"
              type="text"
              class="form-control mb-3"
              :value="$store.barkeeper.device.name"
              @change="$store.barkeeper.setDeviceName($event.target.value)">

            <details x-data="{ endpoint: '', card: '', peerId: '' }">
              <summary>Sync server</summary>
              <p class="mt-2 text-body-secondary small">
                Every member of a space has to use the same sync server. Changing it reloads barkeeper.
              </p>
              <input type="text" class="form-control mb-2" placeholder="wss://sync.example.org" x-model="endpoint">
              <textarea class="form-control mb-2" rows="3" placeholder="Server contact card (JSON)" x-model="card"></textarea>
              <input type="text" class="form-control mb-2" placeholder="Server peer id" x-model="peerId">
              <button type="button" class="btn btn-outline-primary" @click="$store.barkeeper.saveServer(endpoint, card, peerId)">Use this server</button>
              <button type="button" class="btn btn-outline-secondary" @click="$store.barkeeper.resetServer()">Use the default</button>
            </details>
          </div>
        </div>
      </section>

      <div class="container mb-3">
        <button type="button" class="btn btn-primary" @click="$store.barkeeper.export()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-download" viewBox="0 0 16 16">

                      </div>
                    </td>
                    <td :class="$store.barkeeper.getEvent.barProgram.purchases[item.id].checked ? 'opacity-25' : ''">
                      <span x-text="item.comment"></span>
                    </td>
                    <td style="width: 5rem;" :class="$store.barkeeper.getEvent.barProgram.purchases[item.id].checked ? 'opacity-25' : ''">
                      <div class="input-group">
                        <input
                          type="number"
                          step="0.01"
                          class="form-control text-end"
                          :class="$isValidNumber($store.barkeeper.getEvent.barProgram.purchases[item.id].expense) ? 'is-invalid' : ''"
                          x-model.number="$store.barkeeper.getEvent.barProgram.purchases[item.id].expense">
                        <span class="input-group-text">€</span>
                      </div>
                    </td>
                    <td style="width: 15rem;" :class="$store.barkeeper.getEvent.barProgram.purchases[item.id].checked ? 'opacity-25' : ''">
                      <input
                        type="text"
                        class="form-control"
                        x-model="$store.barkeeper.getEvent.barProgram.purchases[item.id].comment">
                    </td>
                    <td class="text-end no-wrap" style="width: 7rem;">
                      <span
                        :style="((+item.num * +item.price) - $store.barkeeper.getEvent.barProgram.purchases[item.id].expense) >= 0 ? 'color: green;' : 'color: red;' "
                        x-text="$formatCurrency((+item.num * +item.price) - $store.barkeeper.getEvent.barProgram.purchases[item.id].expense)"></span>
                    </td>
                  </tr>
                </template>

                  <tr>
                    <td colspan="9"></td>
                    <td class="text-end no-wrap" style="width: 7rem;">
                      <div style="border-top: 6px double black;">
                        <span
                          x-text="$formatCurrency($store.barkeeper.shoppingList.filter((item) => !item.hideInShoppingList ).reduce((acc, item) => acc + (+item.num * +item.price), 0 ))"></span>
                      </div>
                    </td>
                    <td colspan="4"></td>
                    <td class="text-end no-wrap" style="width: 7rem;">
                      <div style="border-top: 6px double black;">
                        <span
                          :style="($store.barkeeper.shoppingList.filter((item) => !item.hideInShoppingList ).reduce((acc, item) => acc + ((+item.num * +item.price) - $store.barkeeper.getEvent.barProgram.purchases[item.id].expense), 0 )) >= 0 ? 'color: green;' : 'color: red;' "
                          x-text="$formatCurrency($store.barkeeper.shoppingList.filter((item) => !item.hideInShoppingList ).reduce((acc, item) => acc + ((+item.num * +item.price) - $store.barkeeper.getEvent.barProgram.purchases[item.id].expense), 0 ))"></span>
                      </div>
                    </td>
                  </tr>

              </tbody>
            </table>

          </div>

        </div>
      </div>

    </div>
  </template>

<!-- Ingredients -->
  <template x-if="$store.barkeeper.activeTab === 'Ingredients'"> <!-- template / ingredients -->

    <div class="container p-3" x-data="{searchIngredients: ''}"> <!-- container -->

      <div class="alert alert-warning" role="alert">
        Warning: removing an ingredient removes it from all cocktails and ingredients that have a recipe listing it!
      </div>

      <div class="input-group">
        <button
          type="button"
          class="btn btn-success"
          x-on:click="$store.barkeeper.addIngredient(searchIngredients)">New Ingredient</button>
          <input 
            type="text"
            class="form-control"
          placeholder="search ingredients..."
            x-model="searchIngredients">
      </div>

      <section class="mt-3"> <!-- section / ingredients -->
        <template
          x-for="ingredient in $store.barkeeper.searchIngredient(searchIngredients)"
          :class="'cards-' + $store.barkeeper.searchIngredient(searchIngredients)"
          :key="ingredient.id"> <!-- template / ingredient card -->
          <div>
            <div
              class="card shadow-sm rounded"
              x-bind:style="(ingredient.ingredients.length === 0 && ingredient.sources.length === 0) ? 'border-color: red; border-width: 3px' : ''">

  <!-- Ingredients / Name -->
              <div class="card-header p-2">
                <input
                  type="text"
                  class="form-control card-title bg-transparent p-1 m-0"
                  style="font-size: 2em;"
                  x-model="ingredient.name">
              </div>

              <div class="card-body">

    <!-- Ingredients / misc -->
                <div class="row mb-3">
                  <div class="col-9">
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text">Base unit</span>
                      </div>
                      <input
                        type="text"
                        class="form-control text-center"
                        x-model="ingredient.baseUnit">
                    </div>
                  </div>
                  <div class="col-3">
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text">Color</span>
                      </div>
                      <input
                        type="color"
                        class="form-control form-control-color"
                        x-model="ingredient.color">
                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-6">
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text">AbV</span>
                      </div>
                      <input
                        type="number"
                        step="0.01"
                        class="form-control text-end"
                        x-model.number="ingredient.abv">
                      <div class="input-group-append">
                        <span class="input-group-text">%</span>
                      </div>
                    </div>
                  </div>
                  <div class="col-6">
                    <div class="input-group">
                      <div class="input-group-prepend">
                        <span class="input-group-text">safety</span>
                      </div>
                      <input
                        type="number"
                        step="0.001"
                        class="form-control text-end"
                        x-model.number="ingredient.safetyFactor">
                    </div>
                  </div>
                </div>

    <!-- Ingredients / unit conversion -->
                <label for="units"><h5>Conversion table</h5></label>
                <div id="units" class="row">

                  <!-- standard units -->
                  <template x-for="unit in $store.barkeeper.getIngredientStandardUnits(ingredient.id)">
                    <div class="input-group mb-1">
                      <div class="col-6">
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text">1</span>
                          </div>
                          <div
                            class="form-control"
                            x-text="unit[0]"></div>
                          <div class="input-group-append">
                            <span class="input-group-text">=</span>
                          </div>
                        </div>
                      </div>

                      <div class="col-5">
                        <div class="input-group">
                          <div
                            class="form-control text-end"
                            x-text="$formatNumber(unit[1])"></div>
                          <div class="input-group-append">
                            <span class="input-group-text" x-text="ingredient.baseUnit"></span>
                          </div>
                        </div>
                      </div>

                      <div class="col-1">
                      </div>
                    </div>
                  </template>

                  <!-- ingredient specific units -->
                  <template x-for="unit in ingredient.units">
                    <div class="input-group mb-1">
                      <div class="col-6">
                        <div class="input-group">
                          <div class="input-group-prepend">
                            <span class="input-group-text">1</span>
                          </div>
                          <input
                            type="text"
                            class="form-control"
                            :class="($store.barkeeper.getIngredientUnits(ingredient.id, dedupe = false).filter((e) => e[0] === unit[0]).length !== 1 || unit[0] === '' || unit[0] === ingredient.baseUnit) ? 'is-invalid' : ''"
                            x-model="unit[0]">
                          <div class="input-group-append">
                            <span class="input-group-text">=</span>
                          </div>
                        </div>
                      </div>

                      <div class="col-5">
                        <div class="input-group">
                          <input
                              type="number"
                              step="0.01"
                              class="form-control text-end"
                              :class="$isValidNumberNotZero(unit[1]) ? 'is-invalid' : ''"
                              x-model.number="unit[1]">
                          <div class="input-group-append">
                            <span class="input-group-text" x-text="ingredient.baseUnit"></span>
                          </div>
                        </div>
                      </div>

                      <div class="col-1">
                        <button
                          type="button"
                          class="btn btn-outline-danger btn-xs m-1 p-0 w-100"
                          x-on:click="ingredient.units = ingredient.units.filter((e) => e[0] !== unit[0])">✗</button>
                      </div>
                    </div>
                  </template>

                  <div class="input-group justify-content-md-end" style="padding-right: 7px;">
                    <button
                      type="button"
                      class="btn btn-outline-success btn-xs col-1 m-1 p-0"
                      x-on:click="ingredient.units.push(['', 0])">✚</button>
                    </div>
                </div>

    <!-- Ingredients / sources -->
                <template x-if="ingredient.ingredients.length === 0">
                  <div>
                    
                    <label for="sources"><h5>Sources</h5></label>
                    <div id="sources" class="row">

                      <template x-for="source in ingredient.sources">
                        <div class="mb-1">

                          <div class="row">
                            <div class="col-11">
                              <input
                                type="text"
                                class="form-control"
                                placeholder="link/shop"
                                x-model="source.shopLink">
                            </div>
                            <div class="col-1">
                              <button
                                type="button"
                                class="btn btn-outline-danger btn-xs p-0 w-100"
                                x-on:click="ingredient.sources = ingredient.sources.filter((e) => JSON.stringify(e) !== JSON.stringify(source))">✗</button>
                            </div>
                          </div>

                          <div class="row mb-3">
                            <div class="col-6">
                              <div class="input-group">
                                <input
                                  type="number"
                                  step="0.001"
                                  class="form-control text-center"
                                  :class="$isValidNumberNotZero(source.size) ? 'is-invalid' : ''"
                                  x-model.number="source.size">
                                <div class="input-group-append">
                                  <span class="input-group-text" x-text="ingredient.baseUnit"></span>
                                </div>
                              </div>
                            </div>

                            <div class="col-6">
                              <div class="input-group">
                                <input
                                    type="number"
                                    step="0.01"
                                    class="form-control text-end"
                                    :class="$isValidNumber(source.price) ? 'is-invalid' : ''"
                                    x-model.number="source.price">
                                <div class="input-group-append">
                                  <span class="input-group-text">€</span>
                                </div>
                              </div>
                            </div>  
                          </div>
                          
                        </div>
                      </template>

                      <div class="input-group justify-content-md-end" style="padding-right: 7px;">
                        <button
                          type="button"
                          class="btn btn-outline-success btn-xs col-1 m-1 p-0"
                          x-on:click="ingredient.sources.push({size: 0, price: 0, shopLink: ''})">✚</button>
                      </div>
                    </div>

                  </div>  
                </template>

    <!-- Ingredients / ingredients -->
                <template x-if="ingredient.sources.length === 0">
                  <div>                      
                    <label :for="'ingredient-' + ingredient.id"><h5>Ingredients</h5></label>
                    <div :id="'ingredient-' + ingredient.id" class="row">

                      <template x-for="(i_ingredient, index) in ingredient.ingredients" :key="i_ingredient.id">
                        <div class="input-group mb-1">
                          <div class="col-2">
                            <template x-if="i_ingredient.id !== undefined">
                              <input
                                type="number"
                                step="0.001"
                                class="form-control text-end"
                                :class="$isValidNumberNotZero(i_ingredient.amount) ? 'is-invalid' : ''"
                                x-model.number="i_ingredient.amount">
                            </template>
                          </div>
                          
                          <div class="col-3">
                            <template x-if="i_ingredient.id !== undefined">
                              <select
                                class="form-select"
                                :class="i_ingredient.unit === '' ? 'is-invalid' : ''"
                                x-model="i_ingredient.unit">
                                <option></option>
                                <template x-for="unit in $store.barkeeper.getIngredientAllowedUnits(i_ingredient.id)">
                                  <option
                                      x-bind:selected="i_ingredient.unit === unit"
                                      x-text="unit"/>
                                </template>
                              </select>
                            </template>
                          </div>

                          <div class="col-6">
                            <div class="dropdown" x-on:click="document.getElementById('ingredientSearch'+index).focus()">
                              <span
                                type="text"
                                class="form-select w-100"
                                data-bs-toggle="dropdown"
                                x-text="(i_ingredient.id === undefined) ? 'ingredient...' : $store.barkeeper.data.ingredients.find((e) => e.id === i_ingredient.id).name"
                              ></span>
                         
                              <ul class="dropdown-menu w-100" x-data="{searchString: ''}">
                                <input
                                  type="text"
                                  class="form-control"
                                  :id="'ingredientSearch-'+i_ingredient.id+'-'+index"
                                  name="search"
                                  x-model="searchString">
                                <template x-for="ingredient in $store.barkeeper.searchIngredient(searchString, excludeIdsArray = [...ingredient.ingredients.flatMap((e) => e.id), ingredient.id])"
                                  :key="ingredient.id">
                                    <li><span
                                      class="dropdown-item"
                                      x-text="ingredient.name"
                                      x-on:click="i_ingredient.id = ingredient.id"></span></li>
                                </template>
                              </ul>
                            </div>
                          </div>
                          <div class="col-1">
                            <button
                              type="button"
                              class="btn btn-outline-danger btn-xs m-1 p-0 w-100"
                              x-on:click="ingredient.ingredients = ingredient.ingredients.filter((e) => e.id !== i_ingredient.id)">✗</button>
                          </div>
                        </div>
                      </template>

                      <div class="input-group justify-content-md-end" style="padding-right: 7px;">
                        <button
                          type="button"
                          class="btn btn-outline-success btn-xs col-1 m-1 p-0"
                          x-on:click="ingredient.ingredients.push({unit: '', amount: 0, id: undefined})">✚</button>
                      </div>

                    </div>
                    <div class="input-group mt-3">
                      <div class="input-group-prepend">
                        <span class="input-group-text">Yield:</span>
                      </div>
                      <input
                        type="number"
                        step="0.01"
                        class="form-control text-center"
                        x-model.number="ingredient.yield">
                      <div class="input-group-append">
                        <span  x-text="ingredient.baseUnit"></span>
                      </div>
                    </div>
                  </div>
                </template>

    <!-- Ingredients / notes -->
                <label :for="'notes-' + ingredient.id"><h5>Notes</h5></label>
                <textarea
                  :id="'notes-' + ingredient.id"
                  class="form-control mt-1 mb-1"
                  rows="5"
                  x-model="ingredient.notes"></textarea>

    <!-- Ingredients / allergens -->
                <label :for="'allergens-' + ingredient.id"><h5>Allergens</h5></label>

                <template x-if="$store.barkeeper.getTags(ingredient.id, 'allergens').length !== 0">

                  <div class="tags-input">
                    <template x-for="(allergen, index) in $store.barkeeper.getTags(ingredient.id, 'allergens')" :key="index">
                      <span class="tags-input-tag">
                        <span x-text="allergen"></span>
                      </span>
                    </template>
                  </div>

                </template>

                <div class="tags-input" :id="'allergens-' + ingredient.id" x-data="{ newAllergen: '' }">
                  <template x-for="(allergen, index) in ingredient.allergens" :key="index">
                    <span class="tags-input-tag">
                      <span x-text="allergen"></span>
                      <button type="button" class="tags-input-remove" @click="ingredient.allergens = ingredient.allergens.filter((e) => e !== allergen)">✗</button>
                    </span>
                  </template>

                  <input
                    type="text"
                    placeholder="..."
                    class="tags-input-text form-control"
                    @keydown.enter.prevent="if (newAllergen.trim() !== '') { ingredient.allergens.push(newAllergen.trim()); newAllergen = '' }"
                    x-model="newAllergen">
                </div>
                
    <!-- Ingredients / vegan -->
                <label :for="'nonVeganIngredients-' + ingredient.id"><h5>Non-vegan ingredients</h5></label>

                <template x-if="$store.barkeeper.getTags(ingredient.id, 'nonVeganIngredients').length !== 0">
                  
                  <div class="tags-input">
                    <template x-for="(allergen, index) in $store.barkeeper.getTags(ingredient.id, 'nonVeganIngredients')" :key="index">
                      <span class="tags-input-tag">
                        <span x-text="allergen"></span>
                      </span>
                    </template>
                  </div>

                </template>

                <div class="tags-input" :id="'nonVeganIngredients-' + ingredient.id" x-data="{ newIngredient: '' }">
                  <template x-for="(v_ingredient, index) in ingredient.nonVeganIngredients" :key="index">
                    <span class="tags-input-tag">
                      <span x-text="v_ingredient"></span>
                      <button type="button" class="tags-input-remove" @click="ingredient.nonVeganIngredients = ingredient.nonVeganIngredients.filter((e) => e !== v_ingredient)">✗</button>
                    </span>
                  </template>

                  <input
                    type="text"
                    placeholder="..."
                    class="tags-input-text form-control"
                    @keydown.enter.prevent="if (newIngredient.trim() !== '') { ingredient.nonVeganIngredients.push(newIngredient.trim()); newIngredient = '' }"
                    x-model="newIngredient">
                </div>

    <!-- Ingredeints / Shopping list settings -->
              </div>

              <div class="card-footer">
                <div class="alert alert-danger mt-3">
                  <div class="form-check form-switch">
                    <input
                      class="form-check-input"
                      :id="'hideInShoppingList-' + ingredient.id"
                      type="checkbox"
                      x-model.boolean="ingredient.hideInShoppingList">
                    <label
                      class="form-check-label"
                      :for="'hideInShoppingList-' + ingredient.id">
                      Hide ingredient in shopping list. Item will still be considered in calculations!
                    </label>
                  </div>
                </div>
                <div class="input-group mb-3" x-data="{ dest_space: '' }" x-show="$store.barkeeper.otherSpaces.length > 0">
                  <div class="input-group-text">Space:</div>
                  <select class="form-select copy-ingredient-to-space" x-model="dest_space">
                    <option value="">choose a space…</option>
                    <template x-for="space in $store.barkeeper.otherSpaces" :key="space.url">
                      <option :value="space.url" x-text="space.name"></option>
                    </template>
                  </select>
                  <button
                    type="button"
                    class="btn btn-primary"
                    :disabled="!dest_space || $store.barkeeper.space.busy"
                    x-on:click="$store.barkeeper.copyIngredientToSpace(ingredient.id, dest_space); dest_space = ''">Copy to space</button>
                </div>
                <button
                  type="button"
                  class="btn btn-danger"
                  x-on:click="$store.barkeeper.removeIngredient(ingredient.id)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-octagon-fill" viewBox="0 0 16 16">
                    <path d="M11.46.146A.5.5 0 0 0 11.107 0H4.893a.5.5 0 0 0-.353.146L.146 4.54A.5.5 0 0 0 0 4.893v6.214a.5.5 0 0 0 .146.353l4.394 4.394a.5.5 0 0 0 .353.146h6.214a.5.5 0 0 0 .353-.146l4.394-4.394a.5.5 0 0 0 .146-.353V4.893a.5.5 0 0 0-.146-.353zm-6.106 4.5L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 1 1 .708-.708"/>
                  </svg>
                  Remove
                </button>
              </div>

              </div>
            </div>
          </template>  <!-- /template / ingredient card -->
        </section> <!-- /section / ingredients -->
      </div> <!-- /container -->
    </template> <!-- /template / ingredients -->
  </div>

</body>
</html>
